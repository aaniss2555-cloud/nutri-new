<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="g" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f6fbf7"/>
      <stop offset="100%" stop-color="#e9f6ec"/>
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="none" />
  <!-- plate shadow -->
  <ellipse cx="300" cy="360" rx="180" ry="30" fill="rgba(10,30,10,0.06)"/>
  <!-- rim -->
  <circle cx="300" cy="260" r="200" fill="#f8fff9" stroke="#dff3e6" stroke-width="18"/>
  <!-- inner plate -->
  <circle cx="300" cy="260" r="150" fill="url(#g)"/>
  <!-- garnish -->
  <g transform="translate(280,210)">
    <path d="M10 10 C 30 -10, 50 -10, 70 10" fill="none" stroke="#2aa87a" stroke-width="6" stroke-linecap="round"/>
    <circle cx="20" cy="24" r="6" fill="#2aa87a"/>
    <circle cx="50" cy="28" r="5" fill="#7fd7a8"/>
  </g>
</svg>
